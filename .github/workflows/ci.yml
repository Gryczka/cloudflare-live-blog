name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `wrangler types` generates worker-configuration.d.ts, which is gitignored
      # because it is derived from wrangler.jsonc. The type check needs it.
      - name: Generate binding types
        run: npx wrangler types

      # Checks app code (astro check) and test code (tsc against test/tsconfig.json)
      # separately, because tests need Workers test types the app must not see.
      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npx astro build

      # A regression here is the one most likely to go unnoticed, because the app
      # keeps working — it just gets slower. See README "Reader payload budget".
      - name: Check reader JavaScript budget
        run: node scripts/check-bundle-budget.mjs
